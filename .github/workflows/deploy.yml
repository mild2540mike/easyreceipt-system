name: Deploy to Windows Server via PM2

on:
  push:
    branches:
      - master # เปลี่ยนเป็นชื่อ branch ที่ต้องการ deploy (เช่น master, release)

jobs:
  deploy:
    runs-on: self-hosted # ดึงเครื่อง Windows Server ของคุณมาทำงาน

    steps:
      # 1. ดึงโค้ดล่าสุดจาก Repository ลงมาที่เครื่อง Server
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Uploaded receipts live under public/uploads on this self-hosted runner.
          clean: false

      # 2. ตั้งค่า Node.js บนตัว Runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ระบุเวอร์ชัน Node.js ที่โครงการใช้
          cache: 'npm'

      # 3. ติดตั้ง Dependencies (ใช้นามสกุล Powershell บน Windows)
      - name: Install Dependencies
        shell: powershell
        run: |
          npm ci

      # 4. สั่ง Build โปรเจกต์
      - name: Build Project
        shell: powershell
        run: |
          npm run build
          npm run api:build

      # 5. สั่ง PM2 รีโหลด/เริ่มทำงานแอปพลิเคชัน
      - name: Deploy and Reload PM2
        shell: powershell
        env:
          # Keep PM2 and its child processes alive after the runner job exits.
          RUNNER_TRACKING_ID: ""
        run: |
          $pm2Command = Join-Path $PWD "node_modules\.bin\pm2.cmd"

          if (-not (Test-Path -LiteralPath $pm2Command)) {
            throw "Local PM2 command was not installed by npm ci."
          }

          & $pm2Command startOrReload ecosystem.config.js --env production
          if ($LASTEXITCODE -ne 0) {
            throw "PM2 could not start or reload the applications."
          }

          & $pm2Command save
          if ($LASTEXITCODE -ne 0) {
            throw "PM2 could not save the current process list."
          }
